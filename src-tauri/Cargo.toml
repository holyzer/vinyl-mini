[package]
name = "vinylmini"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
lofty = "0.21"

[profile.release]
opt-level = "s"
lto = true
strip = true
